name: Sync news.json

on:
  workflow_dispatch: {}
  schedule:
    # Every 6 hours (GitHub's scheduler is not exact; good enough for a lightweight RSS sync).
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Sync news
        run: node scripts/news/sync_news.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/news.json data/news.sync-report.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news.sync-report.json
          git commit -m "data: sync news.json"
          git push
